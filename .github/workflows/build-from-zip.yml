name: Build Exmity Browser from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          ROOT="extracted"
          COUNT=$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$COUNT" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            ROOT=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Find Gradle wrapper
        shell: bash
        run: |
          set -e
          WRAPPER=$(find "$PROJECT_ROOT" -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew was not found in the ZIP."
            exit 1
          fi
          chmod +x "$WRAPPER"
          echo "WRAPPER=$WRAPPER" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Exmity-Browser-APK
          path: |
            ${{ env.PROJECT_ROOT }}/**/build/outputs/apk/debug/*.apk
